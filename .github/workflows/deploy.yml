name: deploy

# Deploys main to AWS after CI passes, or on demand. Does nothing until the
# repository variable AWS_ROLE_ARN is set (see deploy/aws.md).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC token, exchanged for short lived AWS credentials
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  STACK: custody-ledger

jobs:
  deploy:
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stack outputs
        run: |
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "REPO=$(out RepositoryUri)" >> "$GITHUB_ENV"
          echo "INSTANCE=$(out InstanceId)" >> "$GITHUB_ENV"
          echo "URL=$(out URL)" >> "$GITHUB_ENV"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          docker build -t "$REPO:api-$SHA" .
          docker build --build-arg CMD=relay -t "$REPO:relay-$SHA" .
          docker push "$REPO:api-$SHA"
          docker push "$REPO:relay-$SHA"

      - name: Roll out on the instance
        run: |
          host="${REPO%%/*}"
          jq -n --arg host "$host" --arg sha "$SHA" --arg region "$AWS_REGION" '{commands: [
            "set -euo pipefail",
            "cd /opt/ledger",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($host)",
            "sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=\($sha)/\" .env",
            "docker compose pull api relay",
            "docker compose up -d",
            "docker image prune -f"
          ]}' > params.json
          id=$(aws ssm send-command --instance-ids "$INSTANCE" \
                 --document-name AWS-RunShellScript --comment "deploy $SHA" \
                 --parameters file://params.json --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '{status: Status, out: StandardOutputContent, err: StandardErrorContent}'
          status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text)
          test "$status" = "Success"

      - name: Health check
        run: |
          # The first deploy can take a minute while Caddy gets its certificate.
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "$URL/healthz"
          echo "Deployed $SHA to $URL"
